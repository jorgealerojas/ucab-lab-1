events {}

http {
  # DNS embebido de Docker; evita conservar la IP vieja si Compose recrea un nodo.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;

  log_format distributed_lab '$remote_addr request_id=$request_id '
    '"$request" status=$status upstream=$upstream_addr '
    'upstream_status=$upstream_status request_time=$request_time '
    'upstream_time=$upstream_response_time';
  access_log /var/log/nginx/access.log distributed_lab;

  upstream nodejs_app {
    zone nodejs_app 64k;
    server web1:3000 resolve max_fails=1 fail_timeout=5s;
    server web2:3000 resolve max_fails=1 fail_timeout=5s;
  }

  server {
    listen 80;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;

      proxy_connect_timeout 1s;
      proxy_read_timeout 3s;
      # Un 503 de la app expresa que state no esta disponible; se entrega al
      # cliente y no se confunde con la caida del proceso web.
      proxy_next_upstream error timeout http_502 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 4s;

      add_header X-Request-ID $request_id always;
      add_header X-Upstream-Addr $upstream_addr always;
      proxy_pass http://nodejs_app;
    }
  }
}
